# Runs the brain and its LLM server, each in its own container:
#
#   docker compose up --build -d      start both (rebuilding if the code changed)
#   docker compose logs -f brain      watch the brain's output (or `llm` for vLLM's)
#   docker compose exec brain jason new-day
#   docker compose down               stop (sends SIGTERM: a clean shutdown)
#
# Jason's data stays on the host, in ~/jason-data (C:\Users\<you>\jason-data on
# Windows), so rebuilding or deleting the container never touches it. Set
# JASON_DATA to use another folder, and JASON_PORT to listen on another host
# port. Create the token first (`jason gen-token`): if the token file is
# missing, Docker creates an empty folder in its place.

services:
  brain:
    build: .
    image: jason-brain:dev
    restart: unless-stopped
    ports:
      - "${JASON_PORT:-8765}:8765"  # host port : container port
    volumes:
      - ${JASON_DATA:-~/jason-data}/state:/state
      - ${JASON_DATA:-~/jason-data}/link_token:/secrets/link_token:ro
    environment:
      # Only affects the dates in session ids, which are for humans.
      TZ: ${JASON_TZ:-America/New_York}
    stop_grace_period: 15s

  # The live LLM (design §3.3 model 6), served by vLLM in its own image, so the
  # brain's image stays CPU-only. Settings from the M0 spikes
  # (docs/spikes/m0-llm-serving.md, m0-lora-training.md).
  #
  # No `ports:` on purpose: vLLM's API has no auth, so it is reachable only
  # from other containers in this project, as http://llm:8000. It stays on the
  # default project network (not an `internal` one) because it downloads the
  # model from Hugging Face on first start.
  #
  # The brain doesn't wait for it: the link to the body comes up at once, and
  # the model takes 1-3 minutes to load (about 9 GB to download the first time).
  llm:
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - llm-cache:/root/.cache/huggingface  # downloaded weights survive a rebuild
      # Compiled kernels survive a restart too. The first start spent most of
      # its 335 s compiling, and the nightly cycle restarts vLLM every morning.
      - llm-compile-cache:/root/.cache/vllm
    environment:
      # Two more compile caches default to folders the container throws away;
      # keep them in the same volume.
      TRITON_CACHE_DIR: /root/.cache/vllm/triton
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/vllm/inductor
    shm_size: "8gb"
    command:
      - Qwen/Qwen3.5-4B
      - --revision=851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
      - --served-model-name=jason-llm
      - --language-model-only           # text only: no vision encoder
      - --max-model-len=8192
      - --max-num-seqs=4                # live reply plus judge and Wonder calls later
      # A fixed 1 GiB KV cache (about 22,000 tokens) instead of a share of the
      # GPU: the spike's default reserved 6x what one user needs, and the rest
      # is room for the embedding model (M2).
      - --kv-cache-memory-bytes=1073741824
      # With the KV cache fixed, this is only a startup check: vLLM refuses to
      # start unless this share of the GPU is free. The default (0.92) failed
      # because Windows itself holds about 1.3 GB; 0.70 (11.2 GiB) covers the
      # weights (~8.5 GiB), the 1 GiB cache and working memory.
      - --gpu-memory-utilization=0.70
      - --reasoning-parser=qwen3
      - '--default-chat-template-kwargs={"enable_thinking": false}'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 10m  # first start downloads and compiles
    stop_grace_period: 30s

volumes:
  llm-cache:
  llm-compile-cache:
