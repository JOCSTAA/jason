# Config for `jason run --role body`.
# Paths: "~" is your home folder; relative paths are relative to this file.

role = "body"
machine = "mac"                        # this computer: names its events and log folder (the role is "body")
state_dir = "~/jason-data/state"       # raw log (and later memory) for this machine

[link]
brain_url = "ws://jason-brain:8765"    # the brain's Tailscale name; ws:// or wss://
token_file = "~/jason-data/link_token" # created by `jason gen-token`; never commit it
heartbeat_s = 2.0                      # how often to check the link is alive
timeout_s = 10.0                       # this long with no reply means the link is dead
reconnect_max_s = 10.0                 # longest wait between reconnect attempts
clock_sync_s = 5.0                     # how often to measure clock offset and round trip

[audio]
input_device = ""                      # "" = the system default (python -m sounddevice lists devices)
output_device = ""
assets_dir = "../assets"               # model files and the voice-check clip
vad_threshold = 0.5                    # speech when Silero's probability is at least this ...
start_chunks = 3                       # ... for 3 slices of 32 ms in a row
vad_off_threshold = 0.35               # a pause: below this ...
pause_ms = 200.0                       # ... for 200 ms
preroll_ms = 300.0
new_utterance_after_s = 3.0

[stt]
backend = "parakeet-mlx"               # Apple Silicon only; a non-Mac body needs another backend
model = "mlx-community/parakeet-tdt-0.6b-v3"
revision = "ed2b7e8c15f9aaa0b5772e2efb986255eaef7e15"  # 2.5 GB, downloaded once into ~/.cache/huggingface
partial_every_s = 0.5

[tts]
backend = "kokoro-mlx"                 # Apple Silicon only; a non-Mac body needs another backend
model = "mlx-community/Kokoro-82M-bf16"
revision = "a71e4d38b236d968966a2002c4c895dbd12b1c3c"  # 330 MB, downloaded once into ~/.cache/huggingface
voice = "am_puck"                      # chosen by ear (scripts/voice_samples.py)
speed = 1.1
min_words = 3                          # shorter clauses (not the first) are spoken with the next one
lead_ms = 30.0                         # Kokoro's padding (~1 s per clause) is trimmed to these pauses
pause_comma_ms = 120.0
pause_sentence_ms = 250.0
pause_other_ms = 80.0

[floor]
# When Jason answers (jason/body/floor.py): the pause he waits for depends on
# how finished Smart Turn says the user sounds. Hand-picked; learned from M4.
sure_prob = 0.7                        # at or above: sounds finished ...
wait_sure_ms = 200.0                   # ... answer once the pause is 200 ms long
unsure_prob = 0.3                      # between: unsure ...
wait_unsure_ms = 700.0
wait_unlikely_ms = 1500.0              # below unsure_prob: sounds mid-thought
tick_ms = 100.0
policy_version = "rules-1"
