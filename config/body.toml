# Config for `jason run --role body`.
# Paths: "~" is your home folder; relative paths are relative to this file.

role = "body"
machine = "mac"                        # this computer: names its events and log folder (the role is "body")
state_dir = "~/jason-data/state"       # raw log (and later memory) for this machine

[link]
brain_url = "ws://jason-brain:8765"    # the brain's Tailscale name; ws:// or wss://
token_file = "~/jason-data/link_token" # created by `jason gen-token`; never commit it
heartbeat_s = 2.0                      # how often to check the link is alive
timeout_s = 10.0                       # this long with no reply means the link is dead
reconnect_max_s = 10.0                 # longest wait between reconnect attempts
clock_sync_s = 5.0                     # how often to measure clock offset and round trip

[audio]
input_device = ""                      # "" = the system default (python -m sounddevice lists devices)
output_device = ""
assets_dir = "../assets"               # model files and the voice-check clip
vad_threshold = 0.5                    # speech when Silero's probability is at least this ...
start_chunks = 3                       # ... for 3 slices of 32 ms in a row
vad_off_threshold = 0.35               # a pause: below this ...
pause_ms = 200.0                       # ... for 200 ms
preroll_ms = 300.0
new_utterance_after_s = 3.0
