# Config for `jason run --role brain`, as it runs inside the brain's container.
# The container mounts the host's state folder at /state and the token at
# /secrets/link_token (set up in compose.yaml, step 12).

role = "brain"
machine = "brain"
state_dir = "/state"

[link]
listen_host = "0.0.0.0"                # accept connections on every network interface
listen_port = 8765
token_file = "/secrets/link_token"
heartbeat_s = 2.0
timeout_s = 10.0

[llm]
base_url = "http://llm:8000"           # the llm service in compose.yaml (never published)
model = "jason-llm"
model_version = "Qwen/Qwen3.5-4B@851bf6e"  # change whenever the served weights change
persona_file = "persona.md"            # next to this file
history_turns = 20
max_tokens = 256
temperature = 0.7
timeout_s = 10.0
warm_interval_s = 0.75                 # keep the GPU awake while a conversation is active
warm_window_s = 20.0
