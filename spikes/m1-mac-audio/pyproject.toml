# The Mac audio spike's own environment, kept apart from jason's uv.lock until
# the spike has picked which of these libraries the product will use.
[project]
name = "m1-mac-audio-spike"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sounddevice",
    "numpy",
    "soundfile",
    "onnxruntime",
    "transformers",
    "parakeet-mlx",
    "mlx-audio[tts]",
    "misaki[en]",
    "livekit",
    "pyobjc-framework-AVFoundation",
    # Portable (onnxruntime) versions of Parakeet and Kokoro, to compare with MLX.
    "onnx-asr[cpu,hub]",
    "kokoro-onnx",
]

[tool.uv]
package = false
